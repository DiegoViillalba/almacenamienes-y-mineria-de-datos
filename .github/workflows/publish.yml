name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# El PDF del libro NO se compila aqui: es lento (TinyTeX + paquetes LaTeX +
# render de ~1500 paginas) y no cambia en cada push. Se genera localmente
# con ./build-pdf.sh y se sube ya compilado dentro de docs/, junto con el
# HTML. Este workflow solo renderiza HTML (rapido) y publica docs/ tal cual
# quedo en el commit, PDF incluido. Ver pdf-template/README.md.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"

      - name: Render English site
        run: quarto render en --to html

      - name: Render Spanish site
        run: quarto render --to html --no-clean

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

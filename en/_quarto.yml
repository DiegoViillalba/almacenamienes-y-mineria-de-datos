# ==============================================================================
# BUILD & PREVIEW COMMANDS:
# ------------------------------------------------------------------------------
# Render English site only:  quarto render en
# Render Spanish site only:  quarto render --no-clean
# Render both sites:         ./build.sh
# ==============================================================================

project:
  type: book
  output-dir: ../docs/en

book:
  title: "Data Warehousing and Data Mining"
  author: "Diego Villalba"
  search: true
  repo-url: https://github.com/DiegoViillalba/almacenamienes-y-mineria-de-datos
  repo-actions: [edit]
  downloads: [pdf, epub]
  sharing: [twitter, facebook]
  language: en
  sidebar:
    style: "floating"
    collapse-toggle: true

  chapters:
    - index.qmd
    - part: "Business Understanding"
      contents:
        - section: "Fundamentals and Stakeholders"
          contents:
            - unidades/intro/1-0-gestion-stakeholders.qmd
            - unidades/intro/1-0-roles-y-ciclo-vida.qmd
        - section: "Project Planning"
          contents:
            - unidades/intro/1-1-business-understanding-canvas.qmd

    - part: "Data Warehouses"
      contents:
        - section: "Data Warehouse Architecture"
          contents:
            - unidades/almacenes/1-0-arquitecturas-almacenamiento.qmd
            - unidades/almacenes/1-1-datawarehouse.qmd
            - unidades/almacenes/1-1-datalakehouse.qmd
        - section: "Multidimensional Modeling"
          contents:
            - unidades/almacenes/1-2-modelo-multidim.qmd
            - unidades/almacenes/1-3-esquemas-y-redundancia.qmd
            - unidades/almacenes/1-4-scd.qmd
            - unidades/almacenes/1-5-ejemplo-completo.qmd
        - section: "ETL/ELT Integration"
          contents:
            - unidades/almacenes/1-4-pyspark-intro.qmd
            - unidades/almacenes/1-5-etl-extraccion.qmd
            - unidades/almacenes/1-6-etl-transformacion.qmd
            - unidades/almacenes/1-7-etl-practicas.qmd
            - unidades/almacenes/1-8-etl-orquestacion.qmd
        - section: "Modeling for Consumption"
          contents:
            - unidades/OLAP/capitulo_cubos_olap.qmd
            - unidades/OLAP/capitulo_datamarts.qmd
            - unidades/OLAP/capitulo_api_consumo.qmd

    - part: "Data Mining Process"
      contents:
        - section: "Methodological Framework"
          contents:
            - unidades/intro_mineria/2-1-introduccion.qmd
            - unidades/intro_mineria/2-10-CRISP_DM_bigmart.qmd
        - section: "Exploratory Data Analysis (EDA)"
          contents:
            - unidades/intro_mineria/2-2-eda_exploratorio.qmd
            - unidades/intro_mineria/2-3-example_localizacion_bigmart.qmd
            - unidades/intro_mineria/2-4-variabilidad_bigmart.qmd
            - unidades/intro_mineria/2-5-forma_bigmart.qmd
            - unidades/intro_mineria/2-6-heterogeneidad_bigmart.qmd
            - unidades/intro_mineria/2-7-concentracion_bigmart.qmd
            - unidades/intro_mineria/2-9-correlacion_bigmart.qmd
            - unidades/intro_mineria/multivariado/2-11-analisis-multivariado.qmd
            - unidades/intro_mineria/multivariado/2-12-analisis-multivariado-examples.qmd
        - section: "Preprocessing"
          contents:
            - unidades/preprocesamiento/4-1-introduccion.qmd
            - unidades/preprocesamiento/4-3-conversion.qmd
            - unidades/preprocesamiento/4-6-ruido.qmd
            - unidades/preprocesamiento/4-2-datos-faltantes.qmd
            - unidades/preprocesamiento/4-4-PCA.qmd
            - unidades/preprocesamiento/4-5-chi2.qmd

    - part: "Pattern Mining"
      contents:
        - section: "Association Rules"
          contents:
            - unidades/reglas_asociacion/5-1-introduccion.qmd
            - unidades/reglas_asociacion/5-2-metricas-extra.qmd
            - unidades/reglas_asociacion/5-3-fp_growth.qmd

    - part: "Classification"
      contents:
        - section: "Introduction and Evaluation"
          contents:
            - unidades/clasificadores/6-1-clasificacion_arboles.qmd
            - unidades/clasificadores/6-2-metricas_clasificacion.qmd
            - unidades/clasificadores/capitulo_evaluacion_modelos_clasificacion.qmd
        - section: "Trees and Ensembles"
          contents:
            - unidades/clasificadores/6-1-clasificacion_cart.qmd
            - unidades/clasificadores/capitulo_arboles_regresion_lineal.qmd
            - unidades/clasificadores/capitulo_xgboost.qmd
            - unidades/clasificadores/6-3-ejercicio.qmd
        - section: "Linear Models"
          contents:
            - unidades/clasificadores/capitulo_regresion_clasificadores_lineales.qmd
            - unidades/clasificadores/capitulo_regresion_logistica.qmd
            - unidades/clasificadores/capitulo_svm.qmd
        - section: "Probabilistic Classifiers"
          contents:
            - unidades/clasificadores/capitulo_clasificadores_bayesianos.qmd
            - unidades/clasificadores/capitulo_gmm.qmd
        - section: "Neural Networks"
          contents:
            - unidades/clasificadores/capitulo_redes_neuronales.qmd
            - unidades/clasificadores/capitulo_pytorch_jax.qmd

    - part: "Unsupervised Learning"
      contents:
        - section: "Clustering"
          contents:
            - unidades/clustering/capitulo_clustering_intro.qmd
            - unidades/clustering/capitulo_kmeans.qmd
            - unidades/clustering/capitulo_jerarquico.qmd
            - unidades/clustering/capitulo_dbscan.qmd
        - section: "Dimensionality Reduction"
          contents:
            - unidades/clustering/capitulo_tsne_umap.qmd

  appendices:
    - presentaciones.qmd
    - unidades/apendices/glosario.qmd
    - unidades/apendices/preparacion-entrevistas.qmd
    - unidades/apendices/referencias-adicionales.qmd

format:
  html:
    css: ../visionbook.css
    anchor-sections: true
    fontsize: "16px"
    linestretch: 1.6
    mainfont: "Palatino"
    monofont: "Fira Mono"
    smooth-scroll: true
    toc-depth: 3
    code-link: true
    code-fold: false
    code-tools: false
    highlight-style: printing
    code-block-bg: true
    code-overflow: wrap
    theme:
      light: cosmo
      dark: darkly
    fig-align: "center"
    reference-location: margin
    cap-location: margin
    mathjax: true
    lightbox: true
    crossref:
      custom:
        - key: alg
          kind: float
          reference-prefix: Algorithm
    grid:
      gutter-width: 2em
    other-links:
      - text: "Versión en Español 🌐"
        href: ../index.html
        icon: globe
      - text: Contact me
        href: mailto:diego.villalba@ciencias.unam.mx
        icon: envelope

bibliography: ../references.bib

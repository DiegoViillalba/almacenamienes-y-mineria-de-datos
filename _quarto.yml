    - lectures/_output/
    - google5c21f1e0999649d3.html
    - docs/en/

lang: es

book:
  title: "Almacenes y Minería de Datos"
  author: "Diego Villaba"
  description: "Curso completo de Almacenes y Minería de Datos. Aprende sobre Data Warehousing (Kimball, Data Lakehouses, ETL con PySpark) y el ciclo CRISP-DM (EDA, Preprocesamiento y Modelado Predictivo)." # NUEVO: Metadescripción para Google
  site-url: "https://diego-villalba.com/almacenamienes-y-mineria-de-datos/" # NUEVO: URL base necesaria para sitemap y links absolutos
  twitter-card: true
  open-graph: true
  search: true
  repo-url: https://github.com/DiegoViillalba/almacenamienes-y-mineria-de-datos
  repo-actions: [edit]
  downloads: [pdf, epub]
  sharing: [twitter, facebook, linkedin]
  sidebar:
    style: "floating"
    collapse-toggle: true
  
  chapters:
    - index.qmd

    # ──────────────────────────────────────────────────────────────────────
    # PARTE INICIAL — ENTENDIMIENTO DE NEGOCIO
    # Objetivo: Entender cómo comunicarse con stakeholders, traducir necesidades
    # de negocio y planificar el ciclo de vida de los datos.
    # ──────────────────────────────────────────────────────────────────────
    - part: "Entendimiento de Negocio"
      contents:
        - section: "Fundamentos y Stakeholders"
          contents:
            - unidades/intro/1-0-gestion-stakeholders.qmd   # negociación, identificación y planes de engagement
            - unidades/intro/1-0-roles-y-ciclo-vida.qmd      # roles en el equipo de datos, ciclo de vida de datos
        - section: "Planeación del Proyecto"
          contents:
            - unidades/intro/1-1-business-understanding-canvas.qmd  # bitácora, canvas, preguntas priorizadas, criterio de éxito, riesgos

    # ══════════════════════════════════════════════════════════════════════
    # FLUJO GENERAL DEL CURSO
    #   Fuentes OLTP ──► ETL/ELT ──► Data Warehouse ──► OLAP
    #                                       │
    #                              Proceso de Minería
    #                    EDA ──► Preprocesamiento ──► Modelado
    #                                       │
    #                    Clasificación / Clustering / Patrones
    #
    # DISTINCIÓN ETL vs PREPROCESAMIENTO:
    #   • ETL (Parte I)  — ingeniería de datos, escala empresarial,
    #     PySpark/dbt/Airflow, produce el DW.
    #   • Preprocesamiento (Parte II) — análisis experimental sobre una
    #     vista del DW, pandas/sklearn/Polars, produce features para un modelo.
    #   El DW es el punto de transferencia entre ambas perspectivas.
    # ══════════════════════════════════════════════════════════════════════

    # ──────────────────────────────────────────────────────────────────────
    # PARTE I — ALMACENES DE DATOS
    # Objetivo: entender cómo se construye y consulta un DW empresarial.
    # Progresión: arquitectura → modelo dimensional → ETL → consulta OLAP
    # ──────────────────────────────────────────────────────────────────────
    - part: "Almacenes de Datos"
      contents:

        # 1 ── Arquitectura del Data Warehouse ─────────────────────────────
        # ¿Qué es un DW? OLTP vs OLAP; Kimball vs Inmon; ACID vs BASE;
        # data lake vs lakehouse. Punto de partida para toda la Parte I.
        - section: "Arquitectura de almacenes de Datos"
          contents:
            - unidades/almacenes/1-0-arquitecturas-almacenamiento.qmd # arquitecturas de almacenamiento de datos
            - unidades/almacenes/1-1-datawarehouse.qmd      # Data Warehouse
            - unidades/almacenes/1-1-datalakehouse.qmd      # Data Lakehouse
            

        - section: "Modelado multidimensional"
          contents:
            - unidades/almacenes/1-2-modelo-multidim.qmd       # hechos, dimensiones, granularidad, aditividad
            - unidades/almacenes/1-3-esquemas-y-redundancia.qmd # estrella, snowflake, constelación, costo de redundancia
            - unidades/almacenes/1-4-scd.qmd                    # SCD tipos 1/2/3, snapshots dbt
            - unidades/almacenes/1-5-ejemplo-completo.qmd       # caso integrador: Café Norte (Kimball end-to-end)
        # 2 ── ETL / ELT a escala ──────────────────────────────────────────
        # Cómo se puebla el DW desde las fuentes OLTP.
        # Prácticas en Databricks Community Edition con PySpark.
        # DIFERENTE al preprocesamiento analítico de la Parte II:
        # aquí el output ES el DW; allá el input ES el DW.
        - section: "Integración ETL/ELT"
          contents:
            - unidades/almacenes/1-4-pyspark-intro.qmd      # ETL, DAG Spark, Databricks setup, fundamentos
            - unidades/almacenes/1-5-etl-extraccion.qmd     # Extract: formatos, JDBC, fuentes heterogéneas JSON/CSV
            - unidades/almacenes/1-6-etl-transformacion.qmd # Transform, Spark SQL, Load (Parquet/Delta), pipeline
            - unidades/almacenes/1-7-etl-practicas.qmd      # Prácticas Databricks: Delta incremental, joins, GX, TPC-H
            - unidades/almacenes/1-8-etl-orquestacion.qmd   # dbt, Airflow/Prefect, mapa de herramientas

        # 3 ── Cubos OLAP ──────────────────────────────────────────────────
        # Capa de consulta analítica sobre el DW.
        # Roll-up, drill-down, slice, dice, pivot · MOLAP/ROLAP/HOLAP.
        # Herramientas: DuckDB, BigQuery, Snowflake, dbt + Metabase.
        - section: "Modelado para consumo"
          contents:
            - unidades/OLAP/capitulo_cubos_olap.qmd
            - unidades/OLAP/capitulo_datamarts.qmd      # teoría de data marts: dependiente/independiente/bus, dimensiones conformadas
            - unidades/OLAP/capitulo_api_consumo.qmd    # consumo moderno: REST, GraphQL, capa semántica / headless BI


    # ──────────────────────────────────────────────────────────────────────
    # PARTES II–IV — PROCESO DE MINERÍA DE DATOS
    # Objetivo: transformar la vista analítica del DW en conocimiento.
    # Progresión: marco metodológico → entender los datos (EDA) →
    #             prepararlos (preprocesamiento) → modelar (Partes V–VII).
    # NOTA: Marco Metodológico, EDA y Preprocesamiento son 3 etapas del
    # MISMO proceso de minería de datos/ciencia de datos. Se dejan como
    # 3 parts consecutivos (en vez de 1 part con 3 sections) para que
    # tengan el mismo peso visual que Extracción de Patrones/Clasificación/
    # No Supervisado, que también son etapas de este proceso y ya son
    # parts independientes. El primer .qmd de cada una debe abrir con un
    # párrafo que la ubique dentro de CRISP-DM (ver Marco Metodológico).
    # ──────────────────────────────────────────────────────────────────────

    # PARTE II ── Marco metodológico ────────────────────────────────────
    # CRISP-DM: fases, roles, entregables. Dónde encajan el DW (Parte I)
    # y el modelado (Partes V–VII) dentro del proceso completo.
    # TODO: añadir ética, sesgo algorítmico, GDPR, LFPDPPP.
    - part: "Marco Metodológico de Minería de Datos"
      contents:
        - unidades/intro_mineria/2-1-introduccion.qmd           # CRISP-DM y proceso general
        - unidades/intro_mineria/2-10-CRISP_DM_bigmart.qmd     # CRISP-DM aplicado: BigMart

    # PARTE III ── Análisis Exploratorio (EDA) ──────────────────────────
    # Entender la vista analítica ANTES de transformarla.
    # El EDA revela qué preprocesamiento será necesario.
    # Herramientas: pandas · Polars · ydata-profiling · plotly/altair.
    - part: "Análisis Exploratorio de Datos (EDA)"
      contents:
        - section: "Fundamentos del EDA"
          contents:
            - unidades/intro_mineria/2-2-eda_exploratorio.qmd
        - section: "Medidas de localización"
          contents:
            - unidades/intro_mineria/2-3-localizacion.qmd
            - unidades/intro_mineria/2-3-example_localizacion_bigmart.qmd
        - section: "Medidas de variabilidad"
          contents:
            - unidades/intro_mineria/2-4-variabilidad.qmd
            - unidades/intro_mineria/2-4-variabilidad_bigmart.qmd
        - section: "Medidas de forma"
          contents:
            - unidades/intro_mineria/2-5-forma.qmd
            - unidades/intro_mineria/2-5-forma_bigmart.qmd
        - section: "Medidas de heterogeneidad"
          contents:
            - unidades/intro_mineria/2-6-heterogeneidad.qmd
            - unidades/intro_mineria/2-6-heterogeneidad_bigmart.qmd
        - section: "Medidas de concentración"
          contents:
            - unidades/intro_mineria/2-7-concentracion.qmd
            - unidades/intro_mineria/2-7-concentracion_bigmart.qmd
        - section: "Medidas de correlación"
          contents:
            - unidades/intro_mineria/2-9-correlacion.qmd
            - unidades/intro_mineria/2-9-correlacion_bigmart.qmd
        - section: "Síntesis del EDA"
          contents:
            - unidades/intro_mineria/2-8-dashboard_global_bigmart.qmd
        - section: "Análisis Multivariado"
          contents:
            - unidades/intro_mineria/multivariado/2-11-analisis-multivariado.qmd       # PCA exploratorio, heatmaps
            - unidades/intro_mineria/multivariado/2-12-analisis-multivariado-examples.qmd  # casos multivariados

    # PARTE IV ── Preprocesamiento ───────────────────────────────────────
    # Transformar la vista analítica para hacerla apta para un estimador.
    # DIFERENTE al ETL de la Parte I: aquí el foco es sklearn Pipeline,
    # escala de DataFrame, orientado al experimento.
    # Progresión: visión general → tipos/codificación → limpieza → selección.
    - part: "Preprocesamiento"
      contents:
        - unidades/preprocesamiento/4-1-introduccion.qmd   # sklearn Pipeline, ColumnTransformer
        - unidades/preprocesamiento/4-3-conversion.qmd     # tipos, OHE, escalado, joins
        - unidades/preprocesamiento/4-6-ruido.qmd          # suavizado, binning, ruido vs outlier
        - unidades/preprocesamiento/4-2-datos-faltantes.qmd # imputación: media/KNN/MICE
        - unidades/preprocesamiento/4-4-PCA.qmd            # reducción lineal, scree plot
        - unidades/preprocesamiento/4-5-chi2.qmd           # selección: Chi², ANOVA F
        # TODO: outliers multivariados (Mahalanobis, Isolation Forest, LOF)
        # → unidades/preprocesamiento/4-7-outliers.qmd
        # TODO: feature selection (RFE, SHAP, Featuretools, Feast)
        # → unidades/preprocesamiento/4-8-feature-selection.qmd
        # TODO: pipelines a escala (Polars, Dask, PySpark, MLflow/BentoML)
        # → unidades/preprocesamiento/4-9-preprocesamiento-escala.qmd

    # ──────────────────────────────────────────────────────────────────────
    # PARTE V — EXTRACCIÓN DE PATRONES
    # Objetivo: descubrir estructura frecuente sin variable objetivo.
    # Progresión: itemsets frecuentes → reglas → métricas → algoritmos eficientes.
    # ──────────────────────────────────────────────────────────────────────
    - part: "Extracción de Patrones"
      contents:

        # Reglas de asociación ────────────────────────────────────────────
        # Soporte, confianza, lift, Apriori → FP-Growth.
        # Herramientas: mlxtend · Spark MLlib FP-Growth (escala).
        - section: "Reglas de Asociación"
          contents:
            - unidades/reglas_asociacion/5-1-introduccion.qmd     # soporte, confianza, lift, Apriori
            - unidades/reglas_asociacion/5-2-metricas-extra.qmd   # conviction, leverage, Zhang, cosine
            - unidades/reglas_asociacion/5-3-fp_growth.qmd        # FP-Growth: árbol de prefijos
            # TODO: minería de secuencias (PrefixSpan, GSP, clickstream)
            # → unidades/patrones/capitulo_secuencias.qmd
            # TODO: detección de anomalías (PyOD, alibi-detect, Isolation Forest)
            # → unidades/patrones/capitulo_anomalias.qmd
            # TODO: minería de texto (TF-IDF, LDA, sentence-transformers, BERTopic)
            # → unidades/patrones/capitulo_texto.qmd

    # ──────────────────────────────────────────────────────────────────────
    # PARTE VI — CLASIFICACIÓN (aprendizaje supervisado)
    # Objetivo: predecir una clase discreta a partir de features.
    # Progresión: evaluación → árboles → lineal → probabilístico → redes.
    # ──────────────────────────────────────────────────────────────────────
    - part: "Clasificación"
      contents:

        # 1 ── Introducción y evaluación ───────────────────────────────────
        # Cómo se mide el desempeño de un clasificador ANTES de elegirlo.
        - section: "Introducción y Evaluación"
          contents:
            - unidades/clasificadores/6-1-clasificacion_arboles.qmd              # problema de clasificación
            - unidades/clasificadores/6-2-metricas_clasificacion.qmd             # precisión, recall, F1
            - unidades/clasificadores/capitulo_evaluacion_modelos_clasificacion.qmd  # k-fold, ROC, AUC

        # 2 ── Árboles de decisión y ensambles ────────────────────────────
        # De un árbol simple a métodos que combinan cientos.
        - section: "Árboles y Ensambles"
          contents:
            - unidades/clasificadores/6-1-clasificacion_cart.qmd              # CART: Gini, entropía, poda
            - unidades/clasificadores/capitulo_arboles_regresion_lineal.qmd   # Bagging, RF, Boosting, k-NN
            - unidades/clasificadores/capitulo_xgboost.qmd                    # XGBoost: Taylor 2°, SHAP
            - unidades/clasificadores/6-3-ejercicio.qmd                       # laboratorio comparativo

        # 3 ── Modelos lineales ────────────────────────────────────────────
        # Frontera de decisión lineal: del perceptrón al kernel SVM.
        - section: "Modelos Lineales"
          contents:
            - unidades/clasificadores/capitulo_regresion_clasificadores_lineales.qmd  # LDA/Fisher, perceptrón
            - unidades/clasificadores/capitulo_regresion_logistica.qmd               # sigmoide, L1/L2, softmax
            - unidades/clasificadores/capitulo_svm.qmd                               # margen máximo, kernel trick

        # 4 ── Clasificadores probabilísticos ─────────────────────────────
        # Modelar P(clase | datos) explícitamente.
        - section: "Clasificadores Probabilísticos"
          contents:
            - unidades/clasificadores/capitulo_clasificadores_bayesianos.qmd  # Bayes, MAP, costos, minimax
            - unidades/clasificadores/capitulo_gmm.qmd                        # GMM: EM, asignación blanda, BIC

        # 5 ── Redes Neuronales ────────────────────────────────────────────
        # De MLP a CNN; implementación en PyTorch y JAX.
        - section: "Redes Neuronales"
          contents:
            - unidades/clasificadores/capitulo_redes_neuronales.qmd   # MLP, backprop, CNN, Dropout
            - unidades/clasificadores/capitulo_pytorch_jax.qmd        # PyTorch vs JAX/Flax en práctica
            # TODO: Transformers (BERT, TabTransformer, PEFT/LoRA, W&B)
            # → unidades/clasificadores/capitulo_transformers.qmd
            # TODO: MLOps (MLflow, FastAPI, Evidently AI, BentoML/Seldon)
            # → unidades/clasificadores/capitulo_mlops.qmd

    # ──────────────────────────────────────────────────────────────────────
    # PARTE VII — APRENDIZAJE NO SUPERVISADO
    # Objetivo: descubrir estructura latente sin variable objetivo.
    # Progresión: métricas de clustering → partitivo → jerárquico →
    #             basado en densidad → reducción de dimensionalidad.
    # Conectar con Parte II: PCA (lineal, reversible) se usa antes del
    # modelo; t-SNE/UMAP (no lineal, irreversible) se usa para visualizar.
    # ──────────────────────────────────────────────────────────────────────
    - part: "Aprendizaje No Supervisado"
      contents:

        # 1 ── Clustering ──────────────────────────────────────────────────
        - section: "Clustering"
          contents:
            - unidades/clustering/capitulo_clustering_intro.qmd   # distancias, silueta, DB, CH, ARI
            - unidades/clustering/capitulo_kmeans.qmd             # K-Means++, K-Medoids, codo
            - unidades/clustering/capitulo_jerarquico.qmd         # Ward/promedio, dendrograma, cofenético
            - unidades/clustering/capitulo_dbscan.qmd             # DBSCAN/HDBSCAN: eps, minPts, ruido

        # 2 ── Reducción de Dimensionalidad ────────────────────────────────
        - section: "Reducción de Dimensionalidad"
          contents:
            - unidades/clustering/capitulo_tsne_umap.qmd   # t-SNE, UMAP, autoencoder PyTorch
            # TODO: Isomap, LLE, Spectral Embedding, Diffusion Maps (sklearn.manifold)
            # → unidades/clustering/capitulo_manifold.qmd
            # TODO: Modelos generativos (VAE, GAN, CTGAN/TabDDPM con SDV)
            # → unidades/clustering/capitulo_generativos.qmd
            # TODO: Aprendizaje auto-supervisado (SimCLR, ts2vec, lightly)
            # → unidades/clustering/capitulo_ssl.qmd

    # ══════════════════════════════════════════════════════════════════════
    # Recurso externo sugerido: anomalías GPS en la capa de ozono
    # https://www.youtube.com/watch?v=9jYj8VZq2sM&t=1s
    # ══════════════════════════════════════════════════════════════════════
  appendices:
    - presentaciones.qmd
    - proyect_examples.qmd
    - unidades/apendices/glosario.qmd
    - unidades/apendices/preparacion-entrevistas.qmd
    - unidades/apendices/referencias-adicionales.qmd



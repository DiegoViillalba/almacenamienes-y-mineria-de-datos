project:
  type: book
  output-dir: docs
  resources:
    - lectures/          # ← único cambio: copia lectures/ a docs/lectures/
    - google5c21f1e0999649d3.html

book:
  title: "Almacenes y Minería de Datos"
  author: "Diego Villaba"
  search: true
  repo-url: https://github.com/DiegoViillalba/almacenamienes-y-mineria-de-datos
  repo-actions: [edit]
  downloads: [pdf, epub]
  sharing: [twitter, facebook]
  language: es
  sidebar:
    style: "floating"
    collapse-toggle: true
  
  chapters:
    - index.qmd
    - part: "Almacennes de datos"
      contents:
        - unidades/almacenes/1-1-introduccion.qmd
        - unidades/almacenes/1-2-modelo-multidim.qmd
    - part: "Introducción a la Minería de Datos"
      contents:
        - unidades/intro_mineria/2-1-introduccion.qmd
    - part: "Análisis Exploratorio de Datos"
      contents:
        - unidades/intro_mineria/2-2-eda_exploratorio.qmd
        - section: "Ejemplos EDA"
          contents:
            - unidades/intro_mineria/2-10-CRISP_DM_bigmart.qmd
            - unidades/intro_mineria/2-3-example_localizacion_bigmart.qmd
            - unidades/intro_mineria/2-4-variabilidad_bigmart.qmd
            - unidades/intro_mineria/2-5-forma_bigmart.qmd
            - unidades/intro_mineria/2-6-heterogeneidad_bigmart.qmd
            - unidades/intro_mineria/2-7-concentracion_bigmart.qmd
            - unidades/intro_mineria/2-9-correlacion_bigmart.qmd
        - unidades/intro_mineria/multivariado/2-11-analisis-multivariado.qmd
        - unidades/intro_mineria/multivariado/2-12-analisis-multivariado-examples.qmd
    - part: "Preprocesamiento de Datos"
      contents:
        - unidades/preprocesamiento/4-1-introduccion.qmd
        - section: "Integración de Datos"
          contents:
            - unidades/preprocesamiento/4-3-conversion.qmd
        - section: "Limpieza de Datos"
          contents:
            - unidades/preprocesamiento/4-6-ruido.qmd
            - unidades/preprocesamiento/4-2-datos-faltantes.qmd
        - section: "Reducción de datos"
          contents:
            - unidades/preprocesamiento/4-4-PCA.qmd
            - unidades/preprocesamiento/4-5-chi2.qmd
    - part: "Cubos de datos"
      contents:
        - unidades/OLAP/capitulo_cubos_olap.qmd
    - part: "Reglas de Asociación"
      contents:
        - unidades/reglas_asociacion/5-1-introduccion.qmd
        - unidades/reglas_asociacion/5-2-metricas-extra.qmd
        - unidades/reglas_asociacion/5-3-fp_growth.qmd
    # ══════════════════════════════════════════════════════════════════════
    # CLASIFICACIÓN  (aprendizaje supervisado con etiquetas discretas)
    # ══════════════════════════════════════════════════════════════════════
    - part: "Clasificación"
      contents:

        # ── 1. Introducción y evaluación ────────────────────────────────
        # El estudiante necesita saber evaluar antes de comparar modelos.
        - section: "Introducción y Evaluación"
          contents:
            # Qué es clasificación; árboles como primer ejemplo intuitivo
            - unidades/clasificadores/6-1-clasificacion_arboles.qmd
            # Métricas esenciales (accuracy, precisión, recall, F1)
            - unidades/clasificadores/6-2-metricas_clasificacion.qmd
            # Capítulo completo: holdout, k-fold, ROC, AUC, matriz de confusión
            - unidades/clasificadores/capitulo_evaluacion_modelos_clasificacion.qmd

        # ── 2. Árboles de decisión ──────────────────────────────────────
        - section: "Árboles de Decisión"
          contents:
            # Algoritmo CART: construcción, poda, criterios de partición
            - unidades/clasificadores/6-1-clasificacion_cart.qmd
            # Árboles de regresión · Ensambles (Bagging, Random Forests,
            # Boosting) · K-Nearest Neighbors
            - unidades/clasificadores/capitulo_arboles_regresion_lineal.qmd
            # Gradient Boosting, XGBoost: objetivo regularizado, Taylor,
            # hiperparámetros, importancia, SHAP
            - unidades/clasificadores/capitulo_xgboost.qmd
            # Laboratorio práctico comparando clasificadores supervisados
            - unidades/clasificadores/6-3-ejercicio.qmd

        # ── 3. Modelos lineales ─────────────────────────────────────────
        - section: "Modelos Lineales"
          contents:
            # Regresión lineal para clasificación; perceptrón; LDA
            - unidades/clasificadores/capitulo_regresion_clasificadores_lineales.qmd
            # Función sigmoide, MLE, odds ratio, regularización L1/L2, softmax
            - unidades/clasificadores/capitulo_regresion_logistica.qmd
            # Margen máximo, kernel trick (lineal, RBF, polinomial), C y γ, SVR
            - unidades/clasificadores/capitulo_svm.qmd

        # ── 4. Clasificadores probabilísticos ───────────────────────────
        - section: "Clasificadores Probabilísticos"
          contents:
            # Teorema de Bayes, MAP, Naïve Bayes, GNB/Multinomial,
            # decisión con costos, criterio minimax
            - unidades/clasificadores/capitulo_clasificadores_bayesianos.qmd
            # EM algorithm, soft vs hard assignment, BIC para selección de K
            - unidades/clasificadores/capitulo_gmm.qmd

        # ── 5. Redes Neuronales ─────────────────────────────────────────
        - section: "Redes Neuronales"
          contents:
            # Perceptrón, MLP, backprop, CNN, regularización (Dropout, BN)
            - unidades/clasificadores/capitulo_redes_neuronales.qmd
            # Implementación práctica: PyTorch, JAX/Flax, comparativa
            - unidades/clasificadores/capitulo_pytorch_jax.qmd

    # ══════════════════════════════════════════════════════════════════════
    # PENDIENTE — APRENDIZAJE NO SUPERVISADO
    # El clustering es un paradigma diferente (sin etiquetas); conviene
    # tratarlo como una parte propia del libro, no como sección de
    # Clasificación.
    #
    # - part: "Aprendizaje No Supervisado"
    #   contents:
    #
    #     - section: "Clustering"
    #       contents:
    #         # Introducción: similitud, distancias, silueta, índice Davies-Bouldin
    #         # unidades/clustering/capitulo_clustering_intro.qmd        # TODO
    #
    #         # K-Means y K-Medoids; elbow method; limitaciones
    #         # unidades/clustering/capitulo_kmeans.qmd                  # TODO
    #
    #         # Clustering jerárquico: enlace simple/completo/Ward,
    #         # dendrogramas, corte a altura h
    #         # unidades/clustering/capitulo_jerarquico.qmd              # TODO
    #
    #         # DBSCAN y HDBSCAN: clusters de forma arbitraria,
    #         # detección de outliers, parámetros eps y minPts
    #         # unidades/clustering/capitulo_dbscan.qmd                  # TODO
    #
    #     - section: "Reducción de Dimensionalidad (avanzada)"
    #       contents:
    #         # t-SNE y UMAP para visualización; autoencoder básico
    #         # unidades/clustering/capitulo_tsne_umap.qmd               # TODO
    # ══════════════════════════════════════════════════════════════════════

  appendices:
    - presentaciones.qmd



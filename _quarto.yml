# ==============================================================================
# COMANDOS DE COMPILACIÓN Y PREVISUALIZACIÓN:
# ------------------------------------------------------------------------------
# 1. Compilar SOLO la versión en español (sin borrar la versión en inglés):
#    $ quarto render --no-clean
#
# 2. Compilar SOLO 1 archivo/capítulo específico en español (rápido):
#    $ quarto render unidades/.../nombre-archivo.qmd
#
# 3. Previsualizar en vivo en el navegador (sitio en español):
#    $ quarto preview
#
# 4. Compilar SOLO la versión en inglés:
#    $ quarto render en
#
# 5. Compilar AMBAS versiones (Español e Inglés):
#    $ ./build.sh
#
# 6. Limpiar cachés temporales de compilación y liberar espacio:
#    $ ./clean.sh
# ==============================================================================

